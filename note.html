<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>write a note — flowers for your loved ones</title>
  <meta name="description" content="Add a message to your bouquet.">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container animate-fade-in">
    <!-- Header -->
    <a href="./index.html" class="logo-link">
      <h2 class="brand-title-small">flowers for your loved ones</h2>
    </a>

    <h2 class="section-heading">WRITE A NOTE</h2>
    <p class="section-subtitle">Add a personal message to your bouquet.</p>

    <!-- Note Card -->
    <div class="note-card-wrapper">
      <div class="note-card">
        <textarea id="note-body" placeholder="Write your message here..."></textarea>
      </div>
    </div>

    <!-- Actions -->
    <div class="btn-group-horizontal">
      <a href="./arrange.html" class="btn btn-small btn-secondary" id="btn-back">BACK</a>
      <button class="btn btn-small btn-primary" id="btn-next">FINISH</button>
    </div>
  </main>

  <script src="./app.js"></script>
  <script>
    // ─── State ─────────────────────────────────
    const mode = getMode();
    const state = loadBuilderState();
    
    if (!state || !state.flowers || state.flowers.length < 1) {
      window.location.href = `./bouquet.html?mode=${mode}`;
    }

    // Set back button mode
    document.getElementById('btn-back').href = `./arrange.html?mode=${mode}`;

    const textarea = document.getElementById('note-body');
    
    // Set default value if no note exists
    if (state.note) {
      textarea.value = state.note;
    } else {
      textarea.value = "Dear ";
    }

    // ─── Actions ───────────────────────────────
    document.getElementById('btn-next').addEventListener('click', () => {
      saveBuilderState({
        note: textarea.value
      });
      window.location.href = `./p.html?mode=${mode}`;
    });
  </script>
</body>
</html>
